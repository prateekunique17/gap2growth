<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Dusty Olive to Warm Stone gradient for the growth trajectory -->
    <linearGradient id="g2gGrowth" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#858875" />
      <stop offset="65%" stop-color="#b8bba9" />
      <stop offset="100%" stop-color="#EAE7DF" />
    </linearGradient>

    <!-- Warm Stone glow -->
    <filter id="stoneGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base badge: Rich Black (#171717) with subtle Dusty Olive (#858875) outline -->
  <rect width="64" height="64" rx="15" fill="#171717" stroke="#858875" stroke-width="1.8" />

  <!-- Stepped milestone pillars (Bridging the gap) -->
  <!-- Step 1: Baseline -->
  <rect x="13" y="44" width="7" height="6" rx="2" fill="#858875" opacity="0.45" />
  <!-- Step 2: Intermediate progression -->
  <rect x="22.5" y="37" width="7" height="13" rx="2" fill="#858875" opacity="0.75" />
  <!-- Step 3: Advanced mastery in Warm Stone (#EAE7DF) -->
  <rect x="32" y="30" width="7" height="20" rx="2" fill="#EAE7DF" opacity="0.95" />

  <!-- Dynamic upward ascending trajectory curve from gap to growth -->
  <path d="M 16 43 Q 28 34 44 19" fill="none" stroke="url(#g2gGrowth)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Minimalist Arrowhead in Warm Stone (#EAE7DF) pointing towards top-right -->
  <path d="M 33 18 L 47 16 L 45 30" fill="none" stroke="#EAE7DF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#stoneGlow)" />

  <!-- Leaf / Sprout of organic growth in Dusty Olive (#858875) -->
  <path d="M 30 33 C 30 24, 42 23, 44 26 C 44 34, 32 36, 30 33 Z" fill="#858875" opacity="0.9" />

  <!-- Peak beacon node in Warm Stone (#EAE7DF) -->
  <circle cx="47" cy="16" r="2.2" fill="#EAE7DF" filter="url(#stoneGlow)" />
</svg>
